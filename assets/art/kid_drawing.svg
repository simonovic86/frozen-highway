<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="44"/>
      <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0.32 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- paper -->
  <rect width="320" height="220" fill="#f0e8c8"/>
  <!-- ground line -->
  <path d="M0 178 Q40 174 80 180 Q140 184 200 176 Q260 168 320 180" stroke="#7a8c30" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- sun -->
  <g transform="translate(40,40)">
    <circle r="18" fill="#f0c040" stroke="#c08030" stroke-width="2.5"/>
    <g stroke="#c08030" stroke-width="3" stroke-linecap="round">
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <line x1="22" y1="0" x2="30" y2="0"/>
      <line x1="0" y1="-30" x2="0" y2="-22"/>
      <line x1="0" y1="22" x2="0" y2="30"/>
      <line x1="-22" y1="-22" x2="-16" y2="-16"/>
      <line x1="22" y1="-22" x2="16" y2="-16"/>
      <line x1="-22" y1="22" x2="-16" y2="16"/>
      <line x1="22" y1="22" x2="16" y2="16"/>
    </g>
  </g>
  <!-- big crayon truck (very kid-style) -->
  <g transform="translate(140,116)">
    <!-- trailer -->
    <rect x="0" y="-22" width="80" height="50" fill="#d04030" stroke="#7a1a14" stroke-width="3"/>
    <!-- cab -->
    <rect x="-46" y="-32" width="42" height="60" fill="#3060c0" stroke="#1a3070" stroke-width="3"/>
    <rect x="-42" y="-26" width="22" height="20" fill="#a0d8f0" stroke="#1a3070" stroke-width="2"/>
    <!-- chimney -->
    <rect x="-22" y="-44" width="6" height="14" fill="#404040" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- wheels -->
    <circle cx="-30" cy="32" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="-12" cy="32" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="22" cy="32" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="60" cy="32" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
  </g>
  <!-- stick figure waving -->
  <g transform="translate(255,138)" stroke="#3a2810" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="9" fill="#f0d8a8"/>
    <line x1="0" y1="-13" x2="0" y2="14"/>
    <line x1="0" y1="-4" x2="-12" y2="-12"/>
    <line x1="0" y1="-4" x2="14" y2="-18"/>
    <line x1="0" y1="14" x2="-9" y2="34"/>
    <line x1="0" y1="14" x2="9" y2="34"/>
    <!-- smile -->
    <path d="M-3 -22 Q0 -19 3 -22"/>
    <circle cx="-3" cy="-25" r="0.8" fill="#3a2810" stroke="none"/>
    <circle cx="3" cy="-25" r="0.8" fill="#3a2810" stroke="none"/>
  </g>
  <!-- text in crayon -->
  <g font-family="'Comic Sans MS', cursive, sans-serif" font-weight="700">
    <text x="14" y="34" font-size="22" fill="#3060c0" transform="rotate(-2 14 34)">DAD</text>
    <text x="76" y="34" font-size="22" fill="#3060c0" transform="rotate(-2 76 34)">+</text>
    <text x="100" y="34" font-size="22" fill="#3060c0" transform="rotate(-2 100 34)">TRUCK</text>
    <text x="14" y="58" font-size="14" fill="#7a1a14">come home soon!!</text>
  </g>
  <!-- heart -->
  <g transform="translate(280,40)">
    <path d="M0 6 C-10 -6 -22 6 0 22 C22 6 10 -6 0 6 Z" fill="#d04030" stroke="#7a1a14" stroke-width="2"/>
  </g>
  <!-- tape strips top -->
  <rect x="40" y="-4" width="56" height="14" fill="#dac890" opacity="0.7" transform="rotate(-3 68 3)"/>
  <rect x="220" y="-4" width="50" height="14" fill="#dac890" opacity="0.7" transform="rotate(2 244 3)"/>
  <!-- corner crease -->
  <path d="M0 220 L24 220 L0 200 Z" fill="#d8cca0" opacity="0.7"/>
  <!-- grain -->
  <rect width="320" height="220" filter="url(#grain)" opacity="0.4"/>
</svg>
