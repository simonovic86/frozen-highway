<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="71"/>
      <feColorMatrix values="0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0 0.08  0 0 0 0.6 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.48">
      <stop offset="0" stop-color="#5b3a14" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#5b3a14" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#3a200a" stop-opacity="0.85"/>
      <stop offset="0.86" stop-color="#5b3a14" stop-opacity="0.55"/>
      <stop offset="0.96" stop-color="#5b3a14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b3a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <!-- main ring -->
  <circle cx="128" cy="128" r="120" fill="url(#ring)"/>
  <!-- inner faint puddle -->
  <circle cx="128" cy="128" r="84" fill="#3a200a" opacity="0.12"/>
  <!-- droplet asymmetry -->
  <circle cx="200" cy="92" r="14" fill="#3a200a" opacity="0.45"/>
  <circle cx="208" cy="100" r="6" fill="#3a200a" opacity="0.7"/>
  <circle cx="44" cy="174" r="9" fill="#3a200a" opacity="0.4"/>
  <circle cx="52" cy="180" r="4" fill="#3a200a" opacity="0.6"/>
  <!-- small splash dots -->
  <g fill="#3a200a">
    <circle cx="216" cy="64" r="2" opacity="0.6"/>
    <circle cx="68" cy="216" r="3" opacity="0.5"/>
    <circle cx="232" cy="158" r="1.5" opacity="0.55"/>
    <circle cx="34" cy="106" r="2.2" opacity="0.5"/>
  </g>
  <!-- grain overlay (clipped to ring shape via two circles) -->
  <g opacity="0.5">
    <rect width="256" height="256" filter="url(#grain)" mask="url(#ringmask)"/>
  </g>
  <mask id="ringmask">
    <circle cx="128" cy="128" r="120" fill="white"/>
    <circle cx="128" cy="128" r="84" fill="black"/>
  </mask>
</svg>
