<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 336" width="512" height="336">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.32  0 0 0 0 0.26  0 0 0 0 0.18  0 0 0 0.45 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="bleach" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8a8"/>
      <stop offset="1" stop-color="#c8b682"/>
    </linearGradient>
    <radialGradient id="sunSpot" cx="0.3" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff5d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff5d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- paper backing -->
  <rect width="512" height="336" fill="url(#paper)"/>
  <!-- sun bleached patch -->
  <rect width="512" height="336" fill="url(#sunSpot)"/>
  <!-- photo image area (slightly inset) -->
  <g filter="url(#bleach)">
    <!-- sky -->
    <rect x="22" y="20" width="468" height="180" fill="#7a8c98"/>
    <!-- distant ridge -->
    <path d="M22 170 L100 140 L180 165 L260 130 L340 155 L420 138 L490 170 L490 200 L22 200 Z" fill="#4b5560"/>
    <!-- ground -->
    <rect x="22" y="200" width="468" height="116" fill="#5e5340"/>
    <!-- horizon haze -->
    <rect x="22" y="160" width="468" height="40" fill="#8a8678" opacity="0.35"/>
    <!-- three figures: silhouettes / faded color -->
    <!-- left figure: woman, bleached -->
    <g transform="translate(110,130)">
      <ellipse cx="0" cy="34" rx="28" ry="42" fill="#3d3325"/>
      <circle cx="0" cy="-4" r="22" fill="#d8b48a"/>
      <path d="M-22 -8 Q0 -32 22 -8 Q18 -22 0 -28 Q-18 -22 -22 -8 Z" fill="#2e2014"/>
      <ellipse cx="-7" cy="-4" rx="2" ry="1.2" fill="#1a1208"/>
      <ellipse cx="7" cy="-4" rx="2" ry="1.2" fill="#1a1208"/>
      <path d="M-5 8 Q0 11 5 8" stroke="#5a3018" stroke-width="1.2" fill="none"/>
    </g>
    <!-- center figure: trucker, FACE SCRATCHED OUT -->
    <g transform="translate(256,124)">
      <ellipse cx="0" cy="40" rx="36" ry="48" fill="#2a2218"/>
      <circle cx="0" cy="-4" r="26" fill="#c8a078"/>
      <!-- scratched face: chaotic ink crosshatch -->
      <g stroke="#0d0a05" stroke-width="2.4" stroke-linecap="round" fill="none">
        <line x1="-22" y1="-22" x2="24" y2="20"/>
        <line x1="-24" y1="-12" x2="22" y2="14"/>
        <line x1="-22" y1="-2" x2="24" y2="-22"/>
        <line x1="-18" y1="14" x2="22" y2="-14"/>
        <line x1="-20" y1="2" x2="20" y2="22"/>
        <line x1="-14" y1="20" x2="22" y2="-2"/>
        <line x1="-22" y1="10" x2="14" y2="-26"/>
      </g>
      <!-- cap brim -->
      <path d="M-32 -14 L32 -14 L26 -22 L-26 -22 Z" fill="#1a1208" opacity="0.6"/>
    </g>
    <!-- right figure: child -->
    <g transform="translate(400,148)">
      <ellipse cx="0" cy="28" rx="22" ry="32" fill="#5a3a18"/>
      <circle cx="0" cy="-2" r="18" fill="#dcb088"/>
      <path d="M-18 -8 Q0 -26 18 -8 L14 -16 Q0 -22 -14 -16 Z" fill="#3a2410"/>
      <ellipse cx="-5" cy="-3" rx="1.6" ry="1" fill="#1a1208"/>
      <ellipse cx="5" cy="-3" rx="1.6" ry="1" fill="#1a1208"/>
      <path d="M-3 6 Q0 9 3 6" stroke="#5a3018" stroke-width="1" fill="none"/>
    </g>
  </g>
  <!-- creases & fold lines -->
  <line x1="0" y1="180" x2="512" y2="184" stroke="#7a6840" stroke-width="1" opacity="0.5"/>
  <line x1="180" y1="0" x2="178" y2="336" stroke="#7a6840" stroke-width="0.8" opacity="0.35"/>
  <!-- bleached border highlight -->
  <rect x="0" y="0" width="512" height="20" fill="#fff5d8" opacity="0.38"/>
  <rect x="0" y="316" width="512" height="20" fill="#fff5d8" opacity="0.32"/>
  <!-- dust grain -->
  <rect width="512" height="336" filter="url(#grain)" opacity="0.55"/>
  <!-- corner wear -->
  <path d="M0 0 L40 0 L0 32 Z" fill="#e8d8a8" opacity="0.7"/>
  <path d="M512 336 L472 336 L512 304 Z" fill="#c8b682" opacity="0.85"/>
  <!-- date scribble -->
  <text x="22" y="324" font-family="monospace" font-size="14" fill="#3a2a14" opacity="0.55">- KOLDA, 23 -</text>
</svg>
