<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="60"/>
      <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.14  0 0 0 0 0.06  0 0 0 0.55 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- yellow / black hazard band -->
  <rect width="320" height="110" fill="#f0c040"/>
  <!-- diagonal stripes -->
  <g fill="#1a1208">
    <polygon points="0,90 0,110 30,110"/>
    <polygon points="60,90 90,90 60,110 30,110"/>
    <polygon points="120,90 150,90 120,110 90,110"/>
    <polygon points="180,90 210,90 180,110 150,110"/>
    <polygon points="240,90 270,90 240,110 210,110"/>
    <polygon points="300,90 320,90 320,110 270,110"/>
    <polygon points="0,0 0,20 30,0"/>
    <polygon points="60,0 90,0 60,20 30,20"/>
    <polygon points="120,0 150,0 120,20 90,20"/>
    <polygon points="180,0 210,0 180,20 150,20"/>
    <polygon points="240,0 270,0 240,20 210,20"/>
    <polygon points="300,0 320,0 320,20 270,20"/>
  </g>
  <!-- warning text -->
  <g font-family="'Impact', sans-serif" fill="#1a1208" text-anchor="middle">
    <text x="160" y="52" font-size="28" font-weight="900" letter-spacing="4">WARNING</text>
    <text x="160" y="76" font-size="14" font-weight="700" letter-spacing="2">DO NOT OPEN BELOW -20</text>
  </g>
  <!-- worn edges -->
  <rect width="320" height="110" filter="url(#grain)" opacity="0.55"/>
  <!-- scratches -->
  <line x1="40" y1="40" x2="200" y2="46" stroke="#1a1208" stroke-width="0.6" opacity="0.5"/>
  <line x1="60" y1="68" x2="160" y2="64" stroke="#3a2410" stroke-width="0.4" opacity="0.4"/>
  <!-- corner peel -->
  <path d="M0 0 L18 0 L0 16 Z" fill="#dac890" opacity="0.6"/>
</svg>
