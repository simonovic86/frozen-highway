<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0.4 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- thermal-print receipt look -->
  <rect width="320" height="220" fill="#e6dab2"/>
  <rect width="320" height="220" fill="#fff8d6" opacity="0.3"/>
  <!-- top tear -->
  <path d="M0 8 L20 4 L40 9 L60 3 L80 10 L100 5 L120 8 L140 4 L160 9 L180 3 L200 8 L220 5 L240 9 L260 4 L280 8 L300 5 L320 9 L320 0 L0 0 Z" fill="#cab87e" opacity="0.6"/>
  <!-- header -->
  <g font-family="monospace" fill="#1a1208">
    <text x="160" y="34" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">VORK-TRANS // DISPATCH</text>
    <line x1="22" y1="44" x2="298" y2="44" stroke="#1a1208" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- main text -->
    <text x="22" y="80" font-size="36" font-weight="700">MILE 12</text>
    <text x="22" y="118" font-size="32" font-weight="700">NO STOP</text>
    <line x1="22" y1="132" x2="240" y2="132" stroke="#1a1208" stroke-width="2.5"/>
    <!-- meta -->
    <text x="22" y="160" font-size="11">RUN # 0049-K  /  CARGO COLD</text>
    <text x="22" y="178" font-size="11">DRIVER  : SIM. /  CHK. KOLDA</text>
    <text x="22" y="196" font-size="11">WINDOW  : -- // PRIORITY 2</text>
    <!-- barcode-ish -->
    <g fill="#1a1208">
      <rect x="216" y="148" width="2" height="46"/>
      <rect x="220" y="148" width="1" height="46"/>
      <rect x="223" y="148" width="3" height="46"/>
      <rect x="228" y="148" width="1" height="46"/>
      <rect x="231" y="148" width="2" height="46"/>
      <rect x="235" y="148" width="4" height="46"/>
      <rect x="241" y="148" width="1" height="46"/>
      <rect x="244" y="148" width="2" height="46"/>
      <rect x="248" y="148" width="1" height="46"/>
      <rect x="251" y="148" width="3" height="46"/>
      <rect x="256" y="148" width="2" height="46"/>
      <rect x="260" y="148" width="1" height="46"/>
      <rect x="263" y="148" width="4" height="46"/>
      <rect x="269" y="148" width="2" height="46"/>
      <rect x="273" y="148" width="1" height="46"/>
      <rect x="276" y="148" width="3" height="46"/>
      <rect x="281" y="148" width="2" height="46"/>
      <rect x="285" y="148" width="1" height="46"/>
      <rect x="288" y="148" width="2" height="46"/>
      <rect x="292" y="148" width="3" height="46"/>
    </g>
  </g>
  <!-- red stamp diag -->
  <g transform="translate(72,140) rotate(-14)" opacity="0.7">
    <rect x="-58" y="-14" width="116" height="28" fill="none" stroke="#a02018" stroke-width="2.5"/>
    <text x="0" y="6" font-family="monospace" font-size="18" fill="#a02018" text-anchor="middle" font-weight="700">DO NOT STOP</text>
  </g>
  <!-- grain -->
  <rect width="320" height="220" filter="url(#grain)" opacity="0.5"/>
</svg>
