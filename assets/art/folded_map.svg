<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 360" width="512" height="360">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="22"/>
      <feColorMatrix values="0 0 0 0 0.34  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.42 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e8dba2"/>
      <stop offset="1" stop-color="#bca668"/>
    </linearGradient>
  </defs>
  <rect width="512" height="360" fill="url(#paper)"/>
  <!-- coastline / borders -->
  <g fill="none" stroke="#6a4a18" stroke-width="1.4" opacity="0.85">
    <path d="M40 60 Q120 40 200 80 Q280 110 360 70 Q440 38 472 90 Q464 160 420 200 Q380 240 320 230 Q260 220 200 250 Q140 280 80 240 Q40 200 40 60 Z"/>
    <!-- inland border -->
    <path d="M180 80 Q220 130 260 120 Q300 110 320 150 Q340 200 290 220" stroke-dasharray="4 3"/>
  </g>
  <!-- highway routes -->
  <g fill="none" stroke="#a02018" stroke-width="3" opacity="0.85">
    <!-- route 9 main -->
    <path d="M52 90 Q140 110 220 120 Q300 130 360 160 Q420 188 460 178" stroke-linecap="round"/>
    <!-- branch -->
    <path d="M220 120 Q230 170 200 220 Q170 260 120 260" stroke-width="2.2"/>
  </g>
  <!-- secondary roads -->
  <g fill="none" stroke="#3a2410" stroke-width="1" opacity="0.7" stroke-dasharray="2 2">
    <path d="M80 130 Q160 160 240 180 Q320 200 380 230"/>
    <path d="M260 60 Q280 100 290 140 Q300 180 280 220"/>
  </g>
  <!-- cities -->
  <g font-family="monospace" font-size="11" fill="#1a1208">
    <circle cx="72" cy="92" r="3.6" fill="#1a1208"/>
    <text x="46" y="85">DROVA</text>
    <circle cx="220" cy="120" r="4" fill="#1a1208"/>
    <text x="206" y="108">JUNCT 9</text>
    <circle cx="358" cy="158" r="4" fill="#1a1208"/>
    <text x="338" y="148">KOLDA</text>
    <circle cx="460" cy="178" r="3.6" fill="#1a1208"/>
    <text x="430" y="170">EAST GATE</text>
    <circle cx="120" cy="260" r="3.4" fill="#1a1208"/>
    <text x="92" y="278">SLATA</text>
  </g>
  <!-- pencil X marks (DANGER) -->
  <g stroke="#1a0c08" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="290" y1="138" x2="312" y2="160"/>
    <line x1="312" y1="138" x2="290" y2="160"/>
    <line x1="178" y1="232" x2="200" y2="254"/>
    <line x1="200" y1="232" x2="178" y2="254"/>
  </g>
  <!-- handwritten margin notes -->
  <g font-family="monospace" font-size="13" fill="#1a0c08" opacity="0.85">
    <text x="312" y="178" transform="rotate(-3 312 178)">black lights</text>
    <text x="200" y="224" transform="rotate(2 200 224)">dont stop</text>
    <text x="40" y="320" transform="rotate(-1 40 320)">REROUTE - via SLATA -</text>
  </g>
  <!-- compass -->
  <g transform="translate(450,40)" stroke="#1a0c08" fill="#1a0c08">
    <circle r="14" fill="none" stroke-width="1.2"/>
    <polygon points="0,-12 4,0 0,2 -4,0" fill="#1a0c08"/>
    <polygon points="0,12 4,2 0,0 -4,2" fill="none" stroke-width="1"/>
    <text x="0" y="-18" font-family="monospace" font-size="9" text-anchor="middle">N</text>
  </g>
  <!-- fold creases -->
  <g stroke="#7a5a30" stroke-width="0.8" opacity="0.5">
    <line x1="170" y1="0" x2="170" y2="360"/>
    <line x1="342" y1="0" x2="342" y2="360"/>
    <line x1="0" y1="180" x2="512" y2="180"/>
  </g>
  <!-- coffee ring -->
  <circle cx="380" cy="80" r="34" fill="none" stroke="#5b3a14" stroke-width="3" opacity="0.4"/>
  <circle cx="380" cy="80" r="26" fill="none" stroke="#5b3a14" stroke-width="1.4" opacity="0.25"/>
  <!-- worn corners -->
  <path d="M0 0 L36 0 L0 30 Z" fill="#bca668" opacity="0.7"/>
  <path d="M512 360 L478 360 L512 332 Z" fill="#a08c54" opacity="0.85"/>
  <!-- grain -->
  <rect width="512" height="360" filter="url(#grain)" opacity="0.55"/>
</svg>
